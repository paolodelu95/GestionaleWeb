<div class="page">
  <div class="page-header">
    <h1 class="page-title">Clienti</h1>
    <button mat-flat-button (click)="open()"><mat-icon>add</mat-icon> Aggiungi</button>
  </div>
  <div class="card">
    <table mat-table [dataSource]="clienti" class="mat-mdc-table">
      <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let c">{{c.id}}</td></ng-container>
      <ng-container matColumnDef="ragioneSociale"><th mat-header-cell *matHeaderCellDef>Ragione Sociale</th><td mat-cell *matCellDef="let c"><b>{{c.ragioneSociale}}</b></td></ng-container>
      <ng-container matColumnDef="email"><th mat-header-cell *matHeaderCellDef>Email</th><td mat-cell *matCellDef="let c">{{c.email}}</td></ng-container>
      <ng-container matColumnDef="telefono"><th mat-header-cell *matHeaderCellDef>Telefono</th><td mat-cell *matCellDef="let c">{{c.telefono}}</td></ng-container>
      <ng-container matColumnDef="indirizzo"><th mat-header-cell *matHeaderCellDef>Indirizzo</th><td mat-cell *matCellDef="let c">{{indirizzo(c)}}</td></ng-container>
      <ng-container matColumnDef="codiceFiscale"><th mat-header-cell *matHeaderCellDef>Cod. Fiscale</th><td mat-cell *matCellDef="let c">{{c.codiceFiscale}}</td></ng-container>
      <ng-container matColumnDef="azioni"><th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c" class="table-actions">
          <button mat-icon-button (click)="open(c)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="delete(c)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    @if (!clienti.length) { <p style="padding:16px;color:#94a3b8">Nessun cliente</p> }
  </div>
</div>
