<div class="page">
  <div class="page-header">
    <h1 class="page-title">Clienti</h1>
    <button mat-flat-button type="button" (click)="open()"><mat-icon>add</mat-icon> Aggiungi</button>
    <button mat-stroked-button type="button" (click)="print()"><mat-icon>print</mat-icon> Stampa</button>
    <button mat-stroked-button type="button" (click)="exportExcel()"><mat-icon>download</mat-icon> Esporta Excel</button>
    <button mat-stroked-button type="button" (click)="importInput.click()"><mat-icon>upload</mat-icon> Importa Excel</button>
    <input #importInput type="file" accept=".xlsx,.xls" class="hidden-input" (change)="importExcel($event)">
  </div>
  <div class="card">
    <mat-form-field class="search-field" appearance="outline">
      <mat-label>Cerca clienti...</mat-label>
      <input matInput (input)="applyFilter($event)">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" matSort class="mat-mdc-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>
      <ng-container matColumnDef="ragioneSociale">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ragione Sociale</th>
        <td mat-cell *matCellDef="let c"><b>{{ c.ragioneSociale }}</b></td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let c">{{ c.email }}</td>
      </ng-container>
      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Telefono</th>
        <td mat-cell *matCellDef="let c">{{ c.telefono }}</td>
      </ng-container>
      <ng-container matColumnDef="indirizzo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Indirizzo</th>
        <td mat-cell *matCellDef="let c">{{ indirizzo(c) }}</td>
      </ng-container>
      <ng-container matColumnDef="codiceFiscale">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Cod. Fiscale</th>
        <td mat-cell *matCellDef="let c">{{ c.codiceFiscale }}</td>
      </ng-container>
      <ng-container matColumnDef="azioni">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c" class="table-actions">
          <button mat-icon-button type="button" title="Modifica" (click)="open(c)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button type="button" color="warn" title="Elimina" (click)="delete(c)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [colSpan]="displayedColumns.length" style="padding:16px;color:#94a3b8;text-align:center">Nessun risultato</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[25, 50, 100]" showFirstLastButtons></mat-paginator>
    @if (!clienti.length) { <p class="empty-msg">Nessun cliente</p> }
  </div>
</div>
