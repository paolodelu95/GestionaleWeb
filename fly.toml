app = "gestionale-web"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/gestionale.db"

[mounts]
  source = "sqlite_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
