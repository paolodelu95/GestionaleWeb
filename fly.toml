# fly.toml app configuration file generated for invoxa on 2026-05-15T21:40:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'invoxa'
primary_region = 'fra'

[build]

[env]
  DB_PATH = '/data/gestionale.db'
  PORT = '3000'
  NODE_ENV = 'production'

[[mounts]]
  source = 'sqlite_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
